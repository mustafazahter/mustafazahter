name: rebuild profile

on:
  schedule:
    - cron: "17 3 * * *"   # every day 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/portrait.json", "assets/mz.json", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: render terminal card, htop and stack panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/render.py
          python3 scripts/extras.py

      - name: commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist assets/stats.json assets/extras.json README.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: rebuild profile panels"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
